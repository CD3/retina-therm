  k: 0.6306 W/m/K
  rho: 992 kg/m^3
  c: 4178 J /kg / K
layers:
  - name: Henle's fiber layer
    z0: 0 um
    d: 7 um
    mua: $( Henle(${/laser/wavelength}) )
  # - name: Photoreceptor layer
  #   z0: 7 cm
  #   d: 60 um
  #   mua: 1 1/cm
  - name: Pigmented RPE
    z0: 67 um
    d: 10 um
    mua: $( RPE(${/laser/wavelength}) )
  # - name: Nonpigmented RPE
  #   z0: 77 um
  #   d: 4 um
  #   mua:  1 1/cm
  - name: Choiroid
    z0: 81 um
    d: 170 um
    mua: $( Choroid(${/laser/wavelength}) )
